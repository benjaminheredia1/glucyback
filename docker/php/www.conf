; Pool php-fpm. Sobrescribe el www.conf de la imagen oficial.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; /ping lo usa el HEALTHCHECK del Dockerfile.
ping.path = /ping
ping.response = pong

; Errores de los workers a stderr para docker logs (el access log lo lleva nginx).
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
