; Ajustes de PHP para produccion (se carga despues de los defaults de la imagen).
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 60
date.timezone = UTC

; OPcache: el codigo no cambia en runtime, no revalidar.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
